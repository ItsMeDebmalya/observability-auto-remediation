# Logstash pipeline: accept JSON logs over TCP/5000 and ship them to
# Elasticsearch, so application and remediation events are searchable in Kibana.

input {
  tcp {
    port  => 5000
    codec => json_lines
  }
}

filter {
  if ![service] {
    mutate { add_field => { "service" => "unknown" } }
  }
  date {
    match  => ["timestamp", "ISO8601"]
    target => "@timestamp"
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "app-logs-%{+YYYY.MM.dd}"
  }
}
