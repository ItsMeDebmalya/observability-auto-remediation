global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/rules/recording.yml
  - /etc/prometheus/rules/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: sample-app
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8080"]
        labels:
          service: sample-app

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
