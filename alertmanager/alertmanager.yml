global:
  resolve_timeout: 1m

route:
  receiver: remediation-webhook
  group_by: ["alertname", "target_service"]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 5m
  routes:
    # Only alerts that carry a remediation label are sent to the webhook.
    - matchers:
        - remediation=~".+"
      receiver: remediation-webhook

receivers:
  - name: remediation-webhook
    webhook_configs:
      - url: "http://remediation-webhook:5001/alert"
        send_resolved: true
